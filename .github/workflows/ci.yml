name: Offline migration gate CI

"on":
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install project and test dependencies
        run: python -m pip install ".[dev]"
      - name: Run offline tests
        run: python -m pytest -q
      - name: Verify saved migration result is expected INVALID
        # CI PASS != migration PASS: green CI reproduces the saved experiment.
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def gate(*arguments):
              # Expected nonzero statuses are captured and checked, never swallowed.
              return subprocess.run(
                  ["gate", *arguments], capture_output=True, text=True, check=False,
              )

          require(not os.environ.get("OPENAI_API_KEY"), "Provider credentials must be absent")
          require(not os.environ.get("GEMINI_API_KEY"), "Provider credentials must be absent")
          baseline_ids = ["current-baseline-01", "current-baseline-02", "current-baseline-03"]
          candidate_id = "candidate-official-01"

          # Validate each baseline independently: an incomplete candidate check
          # returns before it can score the requested current baselines.
          for run_id in baseline_ids:
              baseline = gate("report", "--target", "current", "--run-id", run_id, "--json")
              require(baseline.returncode == 0 and not baseline.stderr, "Invalid saved current baseline")
              scored = json.loads(baseline.stdout)
              require(scored["target"] == "current" and scored["run_id"] == run_id,
                      "Unexpected current baseline identity")
              require(scored["metrics"]["total_cases"] == 12, "Incomplete saved current baseline")

          root = Path("results/candidate") / candidate_id
          require((root / "manifest.json").is_file(), "Candidate manifest is missing")
          require(not (root / "09-glare.json").exists(), "Candidate is unexpectedly complete")
          canonical = [path for path in root.glob("*.json") if path.name != "manifest.json"]
          require(len(canonical) == 11, "Unexpected candidate canonical result count")
          require(len(list((root / "attempts").rglob("*.json"))) == 14,
                  "Unexpected saved candidate attempt count")
          require(len([path for path in root.rglob("*") if path.is_file()]) == 26,
                  "Unexpected saved candidate evidence inventory")

          reason = "Run is incomplete or invalid. Missing canonical cases: 09-glare"
          report = gate("report", "--target", "candidate", "--run-id", candidate_id, "--json")
          require(report.returncode == 2, "Expected incomplete report exit code 2")
          require(not report.stdout, "Incomplete report must not emit scored JSON")
          report_errors = [line for line in report.stderr.splitlines() if line.startswith("gate: error:")]
          require(report_errors == ["gate: error: " + reason], "Unexpected report rejection reason")
          print("Report assertion: exit=2; missing canonical case=09-glare")

          baseline_arguments = [item for run_id in baseline_ids for item in ("--baseline-run-id", run_id)]
          check = gate("check", "--target", "candidate", "--run-id", candidate_id,
                       *baseline_arguments, "--json")
          require(check.returncode == 2, "Expected final migration check exit code 2")
          require(not check.stderr, "Final check must emit only structured decision JSON")
          decision = json.loads(check.stdout)
          require(decision["target"] == "candidate" and decision["run_id"] == candidate_id,
                  "Unexpected candidate decision identity")
          require(decision["decision"] == "INVALID", "Saved migration decision must remain INVALID")
          require(decision["baseline_run_ids"] == baseline_ids, "Unexpected comparison baseline IDs")
          require(decision["comparison_required"] is False, "Final comparison inputs were not retained")
          require(decision["metrics"] is None and decision["comparison"] is None,
                  "Incomplete evidence must not produce complete metrics or a comparison")
          require(decision["errors"] == [reason], "Unexpected INVALID condition")
          require(decision["scoring_problems"] == {
              "target": "candidate", "run_id": candidate_id, "missing_case_ids": ["09-glare"],
              "invalid_case_results": {}, "invalid_outcomes": {}, "unexpected_canonical_files": [],
              "manifest_errors": [], "corpus_errors": [],
          }, "INVALID must be caused solely by missing canonical 09-glare")
          rules = decision["rules"]
          require(len(rules) == 4 and {rule["name"] for rule in rules} == {
              "max_critical_dangerous_mistakes", "min_correct_cases", "max_slow_case_seconds",
              "max_dangerous_regressions",
          }, "Unexpected gate rules")
          require(all(rule["status"] == "not_evaluated" and rule["actual"] is None for rule in rules),
                  "Incomplete candidate must not have evaluated rules or fabricated regression counts")
          print("Check assertion: decision=INVALID; exit=2; missing canonical case=09-glare")
          print("CI PASS != migration PASS: committed experimental result reproduced correctly.")
          PY
