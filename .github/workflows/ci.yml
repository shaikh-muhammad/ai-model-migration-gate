name: Offline migration gate CI

"on":
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install project and test dependencies
        run: python -m pip install ".[dev]"
      - name: Run offline tests
        run: python -m pytest -q
      - name: Reproduce expected historical outcomes offline
        # Historical success means expected observations reproduce, not release approval.
        run: python scripts/evaluate_saved.py historical
